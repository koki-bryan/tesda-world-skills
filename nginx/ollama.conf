# =============================================================================
# SERVER BLOCK 1: Handle HTTP (port 80)
# Purpose: Redirect ALL plain HTTP traffic to HTTPS
# Why: Force encryption. If someone accidentally types http://, 
# we automatically send them to https:// instead.
# =============================================================================
server {
    listen 80;
    server_name localhost;

    # 301 = permanent redirect
    return 301 https://$host$request_uri;
}

# =============================================================================
# SERVER BLOCK 2: Handle HTTPS (port 443)
# Purpose: The actual secure server that proxies to Ollama
# =============================================================================
server {
    listen 443 ssl;
    server_name localhost;

    # -------------------------------------------------------------------------
    # SSL Certificate Paths
    # IMPORTANT: These paths are from the CONTAINER's perspective.
    # Your host folder ~/project/nginx/ maps to /etc/nginx/conf.d/ inside
    # the container. So:
    #   HOST:      ~/project/nginx/ssl/ollama.crt
    #   CONTAINER: /etc/nginx/conf.d/ssl/ollama.crt
    # Same file, two different "addresses"!
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/conf.d/ssl/ollama.crt;
    ssl_certificate_key /etc/nginx/conf.d/ssl/ollama.key;

    # -------------------------------------------------------------------------
    # LOCATION BLOCK: /api/ollama/
    # This is the protected route. Any request to:
    #   https://localhost/api/ollama/...
    # will go through this block.
    # -------------------------------------------------------------------------
    location /api/ollama/ {

        # Require username + password before doing anything else
        auth_basic "Ollama API - Restricted Access";

        # Path to password file — again, container perspective
        # HOST: ~/project/nginx/.htpasswd
        # CONTAINER: /etc/nginx/conf.d/.htpasswd
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        # -------------------------------------------------------------------------
        # proxy_pass: Forward the request to the Ollama container
        # "ollama" = Docker container name, resolved automatically by Docker DNS
        # The trailing slash on http://ollama:11434/ is important!
        # It means: strip the /api/ollama/ prefix before forwarding.
        # Example:
        #   Request comes in: /api/ollama/api/tags
        #   Forwarded to:     http://ollama:11434/api/tags
        # -------------------------------------------------------------------------
        proxy_pass http://ollama:11434/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # -------------------------------------------------------------------------
        # Extended timeouts — AI responses can take 60-120+ seconds
        # Default Nginx timeout is 60s which would cut off long AI responses
        # -------------------------------------------------------------------------
        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;

        # Disable buffering so responses stream properly
        proxy_buffering off;
    }
}
