<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="href={{url_for('static', filename='dist/output.css')}}"
    />
    <title>Email</title>
  </head>
  <body>
    <section class="bg-">
      <h1>Email Drafting Assistant</h1>
      <p>Fill out the details below to generate a tailored email draft.</p>

      <!-- The Form -->
      <form id="emailForm">
        <label for="recipient">Recipient Email/Name:</label><br />
        <input
          type="text"
          id="recipient"
          name="recipient"
          required
          style="width: 300px"
        /><br /><br />

        <label for="subject">Subject Line:</label><br />
        <input
          type="text"
          id="subject"
          name="subject"
          required
          style="width: 300px"
        /><br /><br />

        <label for="tone">Tone:</label><br />
        <select id="tone" name="tone" required>
          <option value="professional">Professional</option>
          <option value="casual">Casual</option>
          <option value="friendly">Friendly</option>
          <option value="urgent">Urgent</option>
        </select>
        <br /><br />

        <label for="key_points">Key Points (List what must be included):</label
        ><br />
        <textarea
          id="key_points"
          name="key_points"
          rows="6"
          required
          style="width: 500px"
        ></textarea
        ><br /><br />

        <button type="submit">Generate Email Draft</button>
      </form>

      <hr />

      <h2>Generated Email Draft:</h2>
      <!-- This is where the result from Flask will be displayed -->
      <div id="outputArea">
        <p>Results will appear here after generation.</p>
      </div>
    </section>
    <section id="output-area"><h1>Output Area</h1></section>
  </body>

  <script src="/static/js/email.js"></script>
</html>
